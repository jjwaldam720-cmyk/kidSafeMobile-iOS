name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Unsigned App
        run: |
          # Find the workspace or project file automatically
          PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
            BUILD_FLAG="-project"
          else
            BUILD_FLAG="-workspace"
          fi

          # Compile without code signing
          xcodebuild $BUILD_FLAG "$PROJECT_FILE" \
            -scheme "Median" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MedianApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: MedianApp-unsigned.ipa
